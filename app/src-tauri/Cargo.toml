[package]
name = "gesture-control-ui"
version = "0.1.0"
description = "The Gesture Control window"
edition = "2021"

[lib]
name = "gesture_control_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
